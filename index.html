    <title>Casa Repose | Premium Furniture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              background: '#050505',
              surface: '#121212',
              surfaceHighlight: '#1E1E1E',
              border: '#2A2A2A',
              primary: '#F59E0B', // Amber for furniture warmth
              primaryGlow: '#F59E0B50',
              text: '#EDEDED',
              textMuted: '#A1A1AA',
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050505;
        color: #EDEDED;

        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }

      }
